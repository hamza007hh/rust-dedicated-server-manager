name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Desktop Executable
        run: npx @tauri-apps/cli build --no-bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-dist
          $bin = Get-ChildItem -Path src-tauri\target -Recurse -Filter "epic-rust-server-launcher-ui.exe" | Where-Object { $_.FullName -match "release" } | Select-Object -First 1
          if ($bin) {
            Copy-Item $bin.FullName release-dist\EpicRust.exe
          }
          if (Test-Path steam_api64.dll) {
            Copy-Item steam_api64.dll release-dist\steam_api64.dll
          }
          if (Test-Path WebView2Loader.dll) {
            Copy-Item WebView2Loader.dll release-dist\WebView2Loader.dll
          }
          tar.exe -a -c -f EpicRust-Windows-x64.zip -C release-dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Epic Rust Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/EpicRust.exe
            EpicRust-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
